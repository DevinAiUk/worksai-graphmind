name: CI/CD — worksai-graphmind

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies from Lockfile
        run: npm ci

      - name: Run Lint & Brand/Secret Hygiene Gate
        run: npm run lint

      - name: Run TypeScript & Syntax Verification
        run: npm run typecheck

      - name: Build Production Bundle (dist/worker.mjs) & Verify UI Assets
        run: |
          npm run build
          test -s dist/worker.mjs
          grep -q "companionTableBody" dist/worker.mjs
          grep -q "BUNDLED_APP_JS" dist/worker.mjs

      - name: Unpack & Execute VS Code Extension Package (.vsix)
        run: |
          mkdir -p /tmp/gm-ext && unzip -q -o releases/worksai-graphmind-1.2.0.vsix -d /tmp/gm-ext
          node -e "const ext = require('/tmp/gm-ext/extension/extension.cjs'); const r = ext.analyzeNotesInWorkspace([{id:'a',path:'a.md',content:'[[b]]'},{id:'b',path:'b.md',content:''}]); if (r.nodeCount !== 2) process.exit(1); console.log('Executed GraphMind VSIX:', r);"

      - name: Run Automated Unit, Server HMAC Auth, Spoof 401 & Tenant Isolation 403 Tests
        run: npm test

      - name: Live Domain Smoke Verification (graphmind.worksai.org)
        run: |
          curl -fsSL -A "Mozilla/5.0 (WorksAI-CI)" https://graphmind.worksai.org/api/health | grep -q '"status":"ok"'
          curl -fsSL -A "Mozilla/5.0 (WorksAI-CI)" https://graphmind.worksai.org/assets/app.js | grep -q 'window.WAI'
